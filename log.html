<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bus Activity Log</title>

<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet"/>

<style>
  body {
    font-family: "Lato", sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
  }

  h2 { margin-top: 0; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
  }

  th, td {
    padding: 6px 8px;
    border-bottom: 1px solid #ddd;
    font-size: 14px;
  }

  th {
    background: #eee;
    text-align: left;
  }

  a {
    display: inline-block;
    margin-bottom: 15px;
    font-size: 14px;
  }
</style>
</head>

<body>

<a href="index.html">⬅ Back to map</a>
<h2>Bus Activity Log</h2>

<table id="logTable">
  <thead>
    <!-- FILTER ROW -->
    <tr class="filter-row">
      <th><select id="filterTime"><option value="">All</option></select></th>
      <th><select id="filterFleet"><option value="">All</option></select></th>
      <th><select id="filterRoute"><option value="">All</option></select></th>
      <th><select id="filterDir"><option value="">All</option></select></th>
    </tr>

    <!-- HEADER ROW -->
    <tr>
      <th>Time</th>
      <th>Fleet</th>
      <th>Route</th>
      <th>Direction</th>
    </tr>
  </thead>

  <tbody></tbody>
</table>


<script src="log.js"></script>

</body>
</html>
